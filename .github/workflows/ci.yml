name: Expense Management API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: expense_management_test

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        env:
          DB_URL: jdbc:mysql://localhost:3306/expense_management_test
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: ExpenseManagementSecretKeyForJwtAuthentication2026SecureKey
          JWT_EXPIRATION: 86400000
        run: ./mvnw clean verify
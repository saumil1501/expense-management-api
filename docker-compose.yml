services:

  mysql:
    image: mysql:8.0
    container_name: expense-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_management

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  api:
    build: .
    container_name: expense-api

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/expense_management
      DB_USERNAME: root
      DB_PASSWORD: root

      JWT_SECRET: ExpenseManagementSecretKeyForJwtAuthentication2026SecureKey
      JWT_EXPIRATION: 86400000

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data:
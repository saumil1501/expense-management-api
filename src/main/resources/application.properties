spring.application.name=expense-management-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:ExpenseManagementSecretKeyForJwtAuthentication2026SecureKey}
jwt.expiration=${JWT_EXPIRATION:86400000}